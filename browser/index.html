<!doctype html><meta charset="utf-8" /><title>Inflect ORT Web proof</title>
<script src="/node_modules/onnxruntime-web/dist/ort.wasm.min.js"></script>
<script type="module">
  import { createInflectFrontend, MAX_TOKENS, splitText } from "/browser/frontend.mjs";
  import { concatenateChunks, encodeFloat32Wav, seededNormalNoise } from "/browser/runtime.mjs";
  (async () => {
    const MAX_FRAMES = 4000;
    const LATENT_CHANNELS = 192;
    const started = performance.now();
    let phase = "initializing";
    try {
      ort.env.wasm.wasmPaths = "/node_modules/onnxruntime-web/dist/";
      ort.env.wasm.numThreads = 1;
      const fetchModel = async (path) => {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`model HTTP ${response.status}`);
        return response.arrayBuffer();
      };
      phase = "creating-sessions";
      const [core, decoder] = await Promise.all([
        fetchModel("/browser/inflect-core.onnx").then((model) => ort.InferenceSession.create(model, { executionProviders: ["wasm"] })),
        fetchModel("/browser/inflect-decoder.onnx").then((model) => ort.InferenceSession.create(model, { executionProviders: ["wasm"] })),
      ]);
      phase = "running-frontend";
      const frontend = await createInflectFrontend();
      if (new URLSearchParams(location.search).has("parity")) {
        const [fixture, prompts] = await Promise.all([
          fetch("/fixtures/vits-frontend-fixture.json").then((response) => response.json()),
          fetch("/fixtures/prompts.json").then((response) => response.json()),
        ]);
        const promptById = new Map(prompts.map((prompt) => [prompt.id, prompt.text]));
        const cases = fixture.map((expected) => {
          const actual = frontend.phonemize(promptById.get(expected.id));
          return { id: expected.id, normalized: actual.normalizedText === expected.normalized_text, phonemes: actual.phonemeText === expected.phoneme_text, ids: JSON.stringify(actual.ids) === JSON.stringify(expected.ids) };
        });
        document.body.textContent = JSON.stringify({ ok: cases.every((result) => result.normalized && result.phonemes && result.ids), cases });
        return;
      }
      const inputText = new URLSearchParams(location.search).get("text") ?? "The quick brown fox jumps over the lazy dog.";
      const sourceChunks = splitText(inputText);
      const frontendOutputs = frontend.phonemizeChunks(inputText);
      if (sourceChunks.length !== frontendOutputs.length) throw new Error("frontend chunk mismatch");
      const synthesizeChunk = async (output, seed) => {
        if (output.ids.length > MAX_TOKENS) throw new Error(`token limit exceeded: ${output.ids.length}`);
        const paddedTokens = new BigInt64Array(MAX_TOKENS);
        output.ids.forEach((id, index) => { paddedTokens[index] = BigInt(id); });
        const coreOutput = await core.run({
          tokens: new ort.Tensor("int64", paddedTokens, [1, MAX_TOKENS]),
          lengths: new ort.Tensor("int64", BigInt64Array.of(BigInt(output.ids.length)), [1]),
          latent_noise: new ort.Tensor("float32", seededNormalNoise(seed, LATENT_CHANNELS, MAX_FRAMES), [1, LATENT_CHANNELS, MAX_FRAMES]),
        });
        const frames = Number(coreOutput.frame_lengths.data[0]);
        if (!Number.isInteger(frames) || frames < 1 || frames > MAX_FRAMES) throw new Error(`invalid predicted frame length ${frames}`);
        const latent = coreOutput.latent.data.subarray(0, LATENT_CHANNELS * frames);
        const waveform = (await decoder.run({ latent: new ort.Tensor("float32", latent, [1, LATENT_CHANNELS, frames]) })).waveform.data;
        return { frames, waveform };
      };
      phase = "running-synthesis";
      const pieces = [];
      let frames = 0;
      for (let index = 0; index < frontendOutputs.length; index += 1) {
        const result = await synthesizeChunk(frontendOutputs[index], index);
        pieces.push(result.waveform);
        frames += result.frames;
      }
      const waveform = concatenateChunks(pieces, sourceChunks);
      let finite = true, min = Infinity, max = -Infinity;
      for (const sample of waveform) { finite &&= Number.isFinite(sample); min = Math.min(min, sample); max = Math.max(max, sample); }
      const wav = encodeFloat32Wav(waveform);
      const wavView = new DataView(wav);
      const wavValid = wavView.getUint32(0, false) === 0x52494646 && wavView.getUint32(8, false) === 0x57415645 && wavView.getUint32(24, true) === 24000 && wavView.getUint16(22, true) === 1;
      document.body.textContent = JSON.stringify({ ok: true, chunks: frontendOutputs.length, tokenCount: frontendOutputs.reduce((sum, output) => sum + output.ids.length, 0), loadMs: performance.now() - started, frames, samples: waveform.length, finite, min, max, wavBytes: wav.byteLength, wavValid });
    } catch (error) {
      document.body.textContent = JSON.stringify({ ok: false, phase, error: String(error), stack: error.stack });
    }
  })();
</script>
