<!doctype html><meta charset="utf-8" /><title>Inflect ORT Web proof</title>
<script src="/node_modules/onnxruntime-web/dist/ort.wasm.min.js"></script>
<script type="module">
  import {
    createInflectFrontend,
    MAX_TOKENS as FRONTEND_MAX_TOKENS,
  } from "/browser/frontend.mjs";
  import { encodeFloat32Wav, seededNormalNoise } from "/browser/runtime.mjs";
  (async () => {
    const MAX_TOKENS = FRONTEND_MAX_TOKENS;
    const MAX_FRAMES = 4000;
    const LATENT_CHANNELS = 192;
    const started = performance.now();
    let phase = "initializing";
    try {
      ort.env.wasm.wasmPaths = "/node_modules/onnxruntime-web/dist/";
      ort.env.wasm.numThreads = 1;
      const fetchModel = async (path) => {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`model HTTP ${response.status}`);
        return response.arrayBuffer();
      };
      phase = "creating-sessions";
      const [core, decoder] = await Promise.all([
        fetchModel("/browser/inflect-core.onnx").then((model) =>
          ort.InferenceSession.create(model, { executionProviders: ["wasm"] }),
        ),
        fetchModel("/browser/inflect-decoder.onnx").then((model) =>
          ort.InferenceSession.create(model, { executionProviders: ["wasm"] }),
        ),
      ]);
      phase = "running-frontend";
      const frontend = await createInflectFrontend();
      if (new URLSearchParams(location.search).has("parity")) {
        const [fixture, prompts] = await Promise.all([
          fetch("/fixtures/vits-frontend-fixture.json").then((response) =>
            response.json(),
          ),
          fetch("/fixtures/prompts.json").then((response) => response.json()),
        ]);
        const promptById = new Map(
          prompts.map((prompt) => [prompt.id, prompt.text]),
        );
        const cases = fixture.map((expected) => {
          const actual = frontend.phonemize(promptById.get(expected.id));
          const mismatch = actual.ids.findIndex(
            (value, index) => value !== expected.ids[index],
          );
          return {
            id: expected.id,
            normalized: actual.normalizedText === expected.normalized_text,
            actualNormalizedText: actual.normalizedText,
            phonemes: actual.phonemeText === expected.phoneme_text,
            ids: JSON.stringify(actual.ids) === JSON.stringify(expected.ids),
            mismatch,
            actualId: actual.ids[mismatch],
            expectedId: expected.ids[mismatch],
          };
        });
        document.body.textContent = JSON.stringify({
          ok: cases.every(
            (result) => result.normalized && result.phonemes && result.ids,
          ),
          cases,
        });
        return;
      }
      const inputText =
        new URLSearchParams(location.search).get("text") ??
        "The quick brown fox jumps over the lazy dog.";
      const frontendOutput = frontend.phonemize(inputText);
      const tokenValues = frontendOutput.ids;
      if (tokenValues.length > MAX_TOKENS) {
        throw new Error(`token limit exceeded: ${tokenValues.length}`);
      }
      const paddedTokens = new BigInt64Array(MAX_TOKENS);
      for (let index = 0; index < tokenValues.length; index += 1) {
        paddedTokens[index] = BigInt(tokenValues[index]);
      }
      phase = "running-core";
      const coreOutput = await core.run({
        tokens: new ort.Tensor("int64", paddedTokens, [1, MAX_TOKENS]),
        lengths: new ort.Tensor(
          "int64",
          BigInt64Array.of(BigInt(tokenValues.length)),
          [1],
        ),
        latent_noise: new ort.Tensor(
          "float32",
          seededNormalNoise(0, LATENT_CHANNELS, MAX_FRAMES),
          [1, LATENT_CHANNELS, MAX_FRAMES],
        ),
      });
      const frames = Number(coreOutput.frame_lengths.data[0]);
      if (!Number.isInteger(frames) || frames < 1 || frames > MAX_FRAMES) {
        throw new Error(`invalid predicted frame length ${frames}`);
      }
      phase = "running-decoder";
      const latent = coreOutput.latent.data.subarray(
        0,
        LATENT_CHANNELS * frames,
      );
      const waveform = (
        await decoder.run({
          latent: new ort.Tensor("float32", latent, [
            1,
            LATENT_CHANNELS,
            frames,
          ]),
        })
      ).waveform.data;
      let finite = true;
      let min = Infinity;
      let max = -Infinity;
      for (const sample of waveform) {
        finite &&= Number.isFinite(sample);
        min = Math.min(min, sample);
        max = Math.max(max, sample);
      }
      const wav = encodeFloat32Wav(waveform);
      const wavView = new DataView(wav);
      const wavValid =
        wavView.getUint32(0, false) === 0x52494646 &&
        wavView.getUint32(8, false) === 0x57415645 &&
        wavView.getUint32(24, true) === 24000 &&
        wavView.getUint16(22, true) === 1;
      document.body.textContent = JSON.stringify({
        ok: true,
        normalizedText: frontendOutput.normalizedText,
        phonemeText: frontendOutput.phonemeText,
        tokenCount: tokenValues.length,
        loadMs: performance.now() - started,
        frames,
        samples: waveform.length,
        finite,
        min,
        max,
        wavBytes: wav.byteLength,
        wavValid,
      });
    } catch (error) {
      document.body.textContent = JSON.stringify({
        ok: false,
        phase,
        error: String(error),
        stack: error.stack,
      });
    }
  })();
</script>
